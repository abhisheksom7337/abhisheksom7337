<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="movingGlow">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7B61FF"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1 0"
        to="1 0"
        dur="3s"
        repeatCount="indefinite"/>
    </linearGradient>

  </defs>

  <rect
      x="15"
      y="15"
      width="1170"
      height="290"
      rx="28"
      fill="#0D1117"/>

  <rect
      x="15"
      y="15"
      width="1170"
      height="290"
      rx="28"
      fill="none"
      stroke="url(#borderGradient)"
      stroke-width="3"
      filter="url(#glow)"/>

  <rect
      x="15"
      y="15"
      width="1170"
      height="290"
      rx="28"
      fill="none"
      stroke="url(#movingGlow)"
      stroke-width="7"
      stroke-dasharray="180 820">

      <animate
          attributeName="stroke-dashoffset"
          from="1000"
          to="0"
          dur="4s"
          repeatCount="indefinite"/>
  </rect>

  <text
      x="600"
      y="125"
      text-anchor="middle"
      fill="white"
      font-size="48"
      font-family="Poppins,Segoe UI,sans-serif"
      font-weight="700">
      Hi 👋 I'm Abhishek Som
  </text>

  <text
      x="600"
      y="175"
      text-anchor="middle"
      fill="#8BD5FF"
      font-size="24"
      font-family="Poppins,Segoe UI,sans-serif">
      Full Stack Developer • AI/ML • Founder of SomX
  </text>

  <text
      x="600"
      y="220"
      text-anchor="middle"
      fill="#BFBFBF"
      font-size="18"
      font-family="Poppins,Segoe UI,sans-serif">
      Building the Campus Super App 🚀
  </text>

</svg>
