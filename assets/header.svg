
<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#875BFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="bgGlow">
      <stop offset="0%" stop-color="#172C52"/>
      <stop offset="100%" stop-color="#080D19"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

    <linearGradient id="movingLine">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#875BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="15" y="15" width="1170" height="290"
        rx="28" fill="url(#bgGlow)"/>

  <!-- Ambient lighting -->
  <circle cx="150" cy="70" r="100" fill="#00D4FF"
          opacity="0.12" filter="url(#softGlow)">
    <animate attributeName="cx" values="150;250;150"
             dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1050" cy="250" r="120" fill="#875BFF"
          opacity="0.15" filter="url(#softGlow)">
    <animate attributeName="cx" values="1050;950;1050"
             dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Background particles -->
  <g fill="#00E5FF">
    <circle cx="100" cy="210" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2"
               dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="90" r="2">
      <animate attributeName="opacity" values="1;0.2;1"
               dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="260" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2"
               dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="65" r="2">
      <animate attributeName="opacity" values="1;0.2;1"
               dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main neon border -->
  <rect x="15" y="15" width="1170" height="290"
        rx="28" fill="none"
        stroke="url(#borderGradient)"
        stroke-width="2.5" filter="url(#glow)"/>

  <!-- Animated light streak -->
  <rect x="15" y="15" width="1170" height="290"
        rx="28" fill="none"
        stroke="url(#movingLine)"
        stroke-width="6"
        stroke-dasharray="150 1010"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
             from="1160" to="0"
             dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative top line -->
  <path d="M 420 55 L 780 55"
        stroke="#00D4FF" stroke-width="1"
        opacity="0.5">
    <animate attributeName="opacity"
             values="0.2;0.8;0.2"
             dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Main heading -->
  <text x="600" y="125"
        text-anchor="middle"
        fill="#FFFFFF"
        font-size="48"
        font-family="Poppins,Segoe UI,sans-serif"
        font-weight="700"
        filter="url(#glow)">
    Hi 👋 I'm Abhishek Som
  </text>

  <!-- Subtitle -->
  <text x="600" y="175"
        text-anchor="middle"
        fill="#75DEFF"
        font-size="24"
        font-family="Poppins,Segoe UI,sans-serif"
        font-weight="500">
    Full Stack Developer • Former Head Boy • Founder of SomX
  </text>

  <!-- Description -->
  <text x="600" y="220"
        text-anchor="middle"
        fill="#C4CAD8"
        font-size="18"
        font-family="Poppins,Segoe UI,sans-serif">
    Building the SomX Campus Super App 🚀
  </text>

  <!-- Bottom decorative line -->
  <path d="M 500 255 L 700 255"
        stroke="#875BFF"
        stroke-width="2"
        opacity="0.7"/>

</svg>
